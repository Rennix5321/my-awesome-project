<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты - Название вашего сайта</title>
  <meta name="description" content="Наши контакты">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>

<body>
  <header class="site-header">
    <img class="site-header__brand" src="assets/favicon.ico" alt="Логотип" width="50" height="50">
    <nav class="site-nav" aria-label="Основная навигация">
      <ul class="site-nav__list">
        <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="about.html">О нас</a></li>
        <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="contacts.html">Контакты</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a> →
      <span class="breadcrumbs__current">Контакты</span>
    </nav>

    <h1>Телефон</h1>
    <p>+7-123-456-78-90</p>

    <section>
      <h2>Электронная почта</h2>
      <p>pochta@example.com</p>
    </section>

    <button class="btn" id="openDialog" type="button">Написать нам</button>

    <dialog id="contactDialog" class="modal" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">Обратная связь</h2>

      <form class="form" id="contactForm" method="dialog" novalidate>
        <label class="form__label" for="email">E-mail</label>
        <input class="form__input" id="email" name="email" type="email" required autocomplete="email">

        <label class="form__label" for="phone">Телефон</label>
        <input class="form__input" id="phone" name="phone" type="tel" inputmode="tel" aria-describedby="phoneHelp"
          placeholder="+7 (___) ___-__-__" required pattern="^\\+7 \\(\\d{3}\\) \\d{3}-\\d{2}-\\d{2}$">
        <small id="phoneHelp">Формат: +7 (900) 000-00-00</small>

        <label class="form__label" for="date">Дата</label>
        <input class="form__input" id="date" name="date" type="date">

        <label class="form__label" for="topic">Тема</label>
        <select class="form__select" id="topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option>Вопрос</option>
          <option>Заказ</option>
        </select>

        <label class="form__label" for="message">Сообщение</label>
        <textarea class="form__textarea" id="message" name="message" rows="4" required></textarea>

        <div class="form__actions">
          <button class="btn" type="button" id="closeDialog">Закрыть</button>
          <button class="btn btn--submit" type="submit">Отправить</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>&copy; 2023 Название вашего сайта. Все права защищены.</p>
    <p>Телефон: +7 (123) 456-78-90</p>
  </footer>
</body>

</html>
